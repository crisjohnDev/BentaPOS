
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BentaPOS - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
            color: #fff;
        }


        /* ==========================================
           MAIN
        ========================================== */

        .login-page {
            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #000;

            padding: 30px;
        }


        .login-container {
            width: 100%;

            max-width: 1000px;

            min-height: 560px;

            display: grid;

            grid-template-columns: 0.95fr 1.05fr;

            gap: 70px;

            align-items: center;
        }


        /* ==========================================
           BRANDING
        ========================================== */

        .brand-section {
            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 20px;
        }


        .logo-wrapper {
            width: 300px;

            height: 300px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 18px;
        }


        .logo {
            width: 100%;

            height: 100%;

            object-fit: contain;
        }


        .brand-title {
            margin: 0;

            font-size: 38px;

            font-weight: 700;

            letter-spacing: -1px;

            color: #fff;
        }


        .brand-description {
            margin: 10px 0 0;

            max-width: 320px;

            color: #888;

            font-size: 14px;

            line-height: 1.5;
        }


        /* ==========================================
           LOGIN
        ========================================== */

        .login-section {
            width: 100%;

            max-width: 430px;

            justify-self: center;
        }


        .login-header {
            margin-bottom: 30px;
        }


        .login-header h1 {
            margin: 0;

            font-size: 34px;

            font-weight: 700;

            letter-spacing: -0.8px;

            color: #fff;
        }


        .login-header p {
            margin: 8px 0 0;

            font-size: 14px;

            color: #777;
        }


        /* ==========================================
           ERROR
        ========================================== */

        .error {
            margin-bottom: 20px;

            padding: 12px 14px;

            border: 1px solid #3d1717;

            border-radius: 8px;

            background: #170909;

            color: #ff7070;

            font-size: 13px;
        }


        /* ==========================================
           FORM
        ========================================== */

        .form-group {
            margin-bottom: 18px;
        }


        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 600;

            color: #ddd;
        }


        .input-wrapper {
            position: relative;
        }


        .form-group input {
            width: 100%;

            height: 50px;

            padding: 0 15px;

            border: 1px solid #292929;

            border-radius: 9px;

            background: #0d0d0d;

            color: #fff;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        .form-group input::placeholder {
            color: #555;
        }


        .form-group input:hover {
            border-color: #3a3a3a;
        }


        .form-group input:focus {
            border-color: #777;

            background: #111;

            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.05);
        }


        /* ==========================================
           LOGIN BUTTON
        ========================================== */

        .login-button {
            width: 100%;

            height: 50px;

            margin-top: 7px;

            border: 0;

            border-radius: 9px;

            background: #fff;

            color: #000;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .login-button:hover {
            background: #e7e7e7;
        }


        .login-button:active {
            transform: scale(0.985);
        }


        /* ==========================================
           FOOTER
        ========================================== */

        .login-footer {
            margin-top: 25px;

            text-align: center;

            color: #555;

            font-size: 12px;
        }


        /* ==========================================
           TABLET
        ========================================== */

        @media (max-width: 850px) {

            .login-container {
                gap: 35px;
            }


            .logo-wrapper {
                width: 240px;

                height: 240px;
            }


            .brand-title {
                font-size: 32px;
            }

        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 700px) {

            .login-page {
                padding: 25px 20px;
            }


            .login-container {
                display: flex;

                flex-direction: column;

                gap: 25px;

                min-height: auto;
            }


            .brand-section {
                padding: 0;

                width: 100%;
            }


            .logo-wrapper {
                width: 170px;

                height: 170px;

                margin-bottom: 8px;
            }


            .brand-title {
                font-size: 28px;
            }


            .brand-description {
                display: none;
            }


            .login-section {
                max-width: 430px;

                width: 100%;
            }


            .login-header {
                margin-bottom: 25px;
            }


            .login-header h1 {
                font-size: 28px;
            }


            .login-footer {
                margin-top: 20px;
            }

        }

    </style>

</head>


<body>


    <main class="login-page">

        <div class="login-container">


            <!-- ======================================
                 BENTAPOS BRANDING
            ======================================= -->

            <section class="brand-section">

                <div class="logo-wrapper">

                    <img
                        src="{% static 'images/logo.png' %}"
                        alt="BentaPOS Logo"
                        class="logo"
                    >

                </div>


                <h2 class="brand-title">
                    BentaPOS
                </h2>


                <p class="brand-description">
                    Sales and Point of Sale Management System
                </p>

            </section>



            <!-- ======================================
                 LOGIN
            ======================================= -->

            <section class="login-section">


                <div class="login-header">

                    <h1>
                        Welcome back
                    </h1>

                    <p>
                        Sign in to continue to BentaPOS
                    </p>

                </div>



                {% if error %}

                    <div class="error">
                        {{ error }}
                    </div>

                {% endif %}



                <form method="POST">

                    {% csrf_token %}


                    <!-- USERNAME -->

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                autocomplete="username"
                                required
                            >

                        </div>

                    </div>



                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                        </div>

                    </div>



                    <!-- LOGIN -->

                    <button
                        type="submit"
                        class="login-button"
                    >
                        Sign In
                    </button>


                </form>


                <div class="login-footer">
                   MR Circuits and Security Inc | BentaPOS &copy; 2026
                </div>


            </section>


        </div>

    </main>


</body>
</html>
