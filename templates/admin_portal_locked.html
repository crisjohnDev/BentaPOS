<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Portal In Use</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #f4f5f7;
        }

        .card {
            width: 420px;
            max-width: calc(100% - 40px);

            padding: 40px;

            background: #ffffff;

            border-radius: 12px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 64px;
            height: 64px;

            margin-bottom: 20px;

            color: #222;
        }

        h1 {
            margin: 0 0 12px;

            font-size: 24px;

            color: #222;
        }

        p {
            margin: 8px 0;

            line-height: 1.6;

            color: #666;
        }

        .retry {
            display: inline-block;

            margin-top: 24px;

            padding: 12px 20px;

            border-radius: 6px;

            background: #111;

            color: white;

            text-decoration: none;
        }

        .retry:hover {
            background: #333;
        }

    </style>

</head>

<body>

    <div class="card">

        <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
        >

            <rect
                x="5"
                y="10"
                width="14"
                height="10"
                rx="2"
            />

            <path
                d="M8 10V7a4 4 0 0 1 8 0v3"
            />

            <circle
                cx="12"
                cy="15"
                r="1"
            />

        </svg>

        <h1>
            Admin Portal In Use
        </h1>

        <p>
            The administrator portal is currently
            being used on another computer.
        </p>

        <p>
            Please try again later.
        </p>

        <a
            href="/admin/"
            class="retry"
        >
            Try Again
        </a>

    </div>

</body>

</html>
